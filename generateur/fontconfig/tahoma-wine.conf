<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ESSAI de la Tahoma de Wine (D69, argument de construction TAHOMA_LIBRE=oui ; voir generateur/Dockerfile et polices/README.md).
     La police de remplacement du projet Wine (paquet fonts-wine, LGPL-2.1+) porte le nom de famille « Tahoma » : on la renomme, À LA LECTURE
     par fontconfig (le fichier n'est pas modifié), en « Wine Tahoma », pour qu'elle ne soit JAMAIS prise pour une vraie Tahoma. Une vraie Tahoma
     déposée dans generateur/polices/ garde la priorité : « Wine Tahoma » n'est qu'une solution de repli de Tahoma (<accept>). -->
<fontconfig>
  <match target="scan">
    <test name="file" compare="contains"><string>/usr/local/share/fonts/wine/</string></test>
    <edit name="family" mode="assign" binding="same"><string>Wine Tahoma</string></edit>
  </match>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>Wine Tahoma</family></accept>
  </alias>
</fontconfig>
