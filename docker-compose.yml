# SIM Documents : application, générateur, base PostgreSQL et Redis sur un seul hôte (VPS Linux).
#
# Lancement :  docker compose up -d --build
# Prérequis  : fichier .env à la racine (modèle : .env.example) ; polices dans generateur/polices/.
# Seul le port de l'application est publié (APP_PORT, 3000 par défaut), et SEULEMENT sur 127.0.0.1 : un proxy inverse
# (Dokploy/Traefik, Caddy, nginx...) assure le HTTPS public et lui transmet les requêtes.
# La base, Redis et le générateur ne sont joignables que depuis ce réseau Docker.

name: sim-documents

x-securite: &securite
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    # Limites de ressources (audit M5) : le VPS est partagé avec le portail RH ; un service qui s'emballe ne doit pas l'emporter avec lui.
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
    volumes:
      # PostgreSQL 18 : l'image attend le volume sur /var/lib/postgresql (et non /data).
      - donnees_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Pas de cap_drop ici : l'entrée de l'image démarre en root puis abandonne ses privilèges (il lui faut SETUID/SETGID).
    restart: unless-stopped
    # Limites de ressources (audit M5) : le VPS est partagé avec le portail RH ; un service qui s'emballe ne doit pas l'emporter avec lui.
    mem_limit: 256m
    cpus: 0.5
    # Mot de passe obligatoire. File de tâches BullMQ (D24) : l'application enfile, le service « travailleur » exécute.
    # appendonly : les tâches en attente survivent à un redémarrage de Redis.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?définir REDIS_PASSWORD dans .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - donnees_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Étape de migration et d'installation : applique les migrations puis s'arrête. Sert aussi aux
  # scripts :  docker compose run --rm outils npm run creer-admin
  outils:
    build:
      context: ./app
      target: outils
    restart: "no"
    # Limites de ressources (audit M5) : le VPS est partagé avec le portail RH ; un service qui s'emballe ne doit pas l'emporter avec lui.
    mem_limit: 1g
    cpus: 1.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Variables exigées par la validation de la configuration de l'application.
      GENERATEUR_URL: http://generateur:8001
      GENERATEUR_SECRET: ${GENERATEUR_SECRET:?définir GENERATEUR_SECRET dans .env}
      AUTH_SECRET: ${AUTH_SECRET:?définir AUTH_SECRET dans .env}
      URL_PUBLIQUE: ${URL_PUBLIQUE:-}
      # Seed de développement seulement (npm run seed:dev, lancé à la main) ; vide sur un serveur.
      # AUTORISER_SEED_DEV n'est volontairement PAS transmis ici : il se donne à chaque lancement (-e).
      SEED_MOT_DE_PASSE: ${SEED_MOT_DE_PASSE:-}
    depends_on:
      postgres:
        condition: service_healthy

  generateur:
    build:
      context: ./generateur
    <<: *securite
    # Limites de ressources (audit M5) : le VPS est partagé avec le portail RH ; un service qui s'emballe ne doit pas l'emporter avec lui.
    mem_limit: 2g
    cpus: 2.0
    environment:
      GENERATEUR_SECRET: ${GENERATEUR_SECRET:?définir GENERATEUR_SECRET dans .env}
      DELAI_CONVERSION_S: ${DELAI_CONVERSION_S:-60}
      # Conversions LibreOffice simultanées, chacune avec son propre profil (session 5a, T8). Même valeur que le travailleur.
      CONVERSIONS_SIMULTANEES: ${CONVERSIONS_SIMULTANEES:-2}
    volumes:
      # Documents émis et profil LibreOffice : conservés entre les redémarrages et les mises à jour.
      - documents:/donnees
    # Aucun port publié : joignable uniquement par l'application, à l'adresse http://generateur:8001

  app:
    build:
      context: ./app
      target: execution
    <<: *securite
    # Limites de ressources (audit M5) : le VPS est partagé avec le portail RH ; un service qui s'emballe ne doit pas l'emporter avec lui.
    mem_limit: 1g
    cpus: 1.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GENERATEUR_URL: http://generateur:8001
      GENERATEUR_SECRET: ${GENERATEUR_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?définir AUTH_SECRET dans .env}
      # Base des QR codes de vérification (D14) ; vide : aucun document ne peut être émis.
      URL_PUBLIQUE: ${URL_PUBLIQUE:-}
      # Derrière le proxy HTTPS : Auth.js fait confiance à l'hôte transmis par le proxy.
      AUTH_TRUST_HOST: "true"
      # File de tâches (D24) : l'application y dépose les imports confirmés et les écritures différées (T14).
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      # Port de l'hôte réglable : le VPS est partagé avec le portail RH, qui peut déjà occuper 3000.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      outils:
        condition: service_completed_successfully
      generateur:
        condition: service_started
      redis:
        condition: service_healthy

  # Travailleur de la file de tâches (D24) : MÊME image et même code serveur que l'application (étape « outils » du
  # Dockerfile, qui garde le code source et tsx). Il produit les certificats des imports en masse et reprend les
  # écritures différées quand le stockage revient (T14). Un seul suffit ; il peut être redémarré à tout moment :
  # les tâches interrompues sont reprises sans doublon.
  travailleur:
    build:
      context: ./app
      target: outils
    <<: *securite
    # Limites de ressources (audit M5) : le VPS est partagé avec le portail RH ; un service qui s'emballe ne doit pas l'emporter avec lui.
    mem_limit: 1g
    cpus: 1.0
    command: ["npm", "run", "travailleur"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GENERATEUR_URL: http://generateur:8001
      GENERATEUR_SECRET: ${GENERATEUR_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?définir AUTH_SECRET dans .env}
      URL_PUBLIQUE: ${URL_PUBLIQUE:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CONVERSIONS_SIMULTANEES: ${CONVERSIONS_SIMULTANEES:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      outils:
        condition: service_completed_successfully
      generateur:
        condition: service_started

volumes:
  donnees_postgres:
  donnees_redis:
  documents:
